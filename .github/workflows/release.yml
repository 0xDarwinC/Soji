name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Generate Release Notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          API_URL="repos/${{ github.repository }}/releases/generate-notes"
          NOTES=$(gh api "$API_URL" -f tag_name="${{ github.ref_name }}" --jq .body)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Soji ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref, '-') }}

      - name: Update Update-Manifest Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: af72302470d57e33d9eb22409523a9a7
        shell: bash
        run: |
          RAW_VERSION="${GITHUB_REF_NAME#v}"
          VERSION=$(echo "$RAW_VERSION" | cut -d'-' -f1)
          
          echo "Processing Version: $VERSION"

          SIG=$(cat src-tauri/target/release/bundle/nsis/*.sig)
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/soji_${VERSION}_x64_en-US.nsis.zip"
          
          JSON_CONTENT=$(jq -n \
            --arg ver "$VERSION" \
            --arg date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg notes "New release ${{ github.ref_name }}" \
            --arg sig "$SIG" \
            --arg url "$DOWNLOAD_URL" \
            '{
              version: $ver,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "windows-x86_64": {
                  signature: $sig,
                  url: $url
                }
              }
            }')
          
          echo "$JSON_CONTENT" | gh gist edit $GIST_ID --add "latest.json=-"